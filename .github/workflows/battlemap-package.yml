name: Battlemap marketplace package

on:
  pull_request:
    paths:
      - 'plugins/quest-portal-battlemap/**'
      - 'scripts/battlemap/**'
      - 'scripts/pendragon/package.py'
      - 'scripts/pendragon/requirements.txt'
      - 'scripts/pendragon/schemas/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/battlemap-package.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/quest-portal-battlemap/**'
      - 'scripts/battlemap/**'
      - 'scripts/pendragon/package.py'
      - 'scripts/pendragon/requirements.txt'
      - 'scripts/pendragon/schemas/**'
      - '.agents/plugins/marketplace.json'
      - '.github/workflows/battlemap-package.yml'

permissions:
  contents: read

concurrency:
  group: battlemap-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validator dependencies
        run: python -m pip install -r scripts/battlemap/requirements.txt
      - name: Run focused offline tests
        run: python -m unittest discover -s scripts/battlemap -p 'test_*.py'
      - name: Validate source and both deterministic archive layouts
        shell: bash
        run: |
          python scripts/battlemap/package.py validate plugins/quest-portal-battlemap
          for layout in wrapped portable; do
            python scripts/battlemap/package.py build plugins/quest-portal-battlemap --layout "$layout" --output "$RUNNER_TEMP/battlemap-$layout.zip" --report "$RUNNER_TEMP/battlemap-$layout.json"
            python scripts/battlemap/package.py validate "$RUNNER_TEMP/battlemap-$layout.zip"
          done
